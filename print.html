<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Impresión de Etiquetas</title>
  <style>
    @page {
      size: 55mm 40mm;
      margin: 0;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: white;
      -webkit-print-color-adjust: exact;
    }
    .label-container {
      width: 55mm;
      height: 40mm;
      box-sizing: border-box;
      page-break-after: always;
      display: flex;
      flex-direction: column;
      padding: 2mm 3mm; /* Ajustado para aprovechar el espacio de 55x40 */
      position: relative;
      overflow: hidden;
    }
    .label-container:last-child {
      page-break-after: avoid; /* Evita página en blanco al final */
    }
    .header-bar {
      background-color: #000;
      color: #fff;
      font-size: 7.2pt;
      font-weight: 900;
      text-align: center;
      padding: 0.8mm 0;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 1.5mm;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .barcode-area {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 13.5mm;
      margin-bottom: 1mm;
    }
    .barcode-svg {
      width: 100%;
      height: 100%;
    }
    .product-code {
      font-size: 9.5pt;
      font-weight: 800;
      text-align: center;
      margin: 0 0 0.8mm 0;
      line-height: 1;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .product-desc {
      font-size: 6.5pt;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      height: 8.5mm;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
      height: 6mm;
    }
    .details-box {
      font-size: 6.2pt;
      font-weight: 600;
      line-height: 1.3;
      color: #333;
    }
    .detail-label {
      font-weight: 800;
      color: #000;
    }
    .detail-val {
      font-weight: 600;
    }
    .cipher-badge {
      background-color: #000;
      color: #fff;
      padding: 0.6mm 2mm;
      font-size: 9.5pt;
      font-weight: 900;
      border-radius: 3px;
      text-align: center;
      line-height: 1;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="labels-root"></div>
</body>
</html>
